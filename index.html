  function renderHome() {
    var list = EXAMS.filter(function (e) { return !S.search || (e.name + ' ' + e.sub + ' ' + e.tags).toLowerCase().indexOf(S.search) !== -1; });
    var totalQ = EXAMS.reduce(function (a, e) { return a + e.qs; }, 0), totalS = EXAMS.reduce(function (a, e) { return a + e.sets; }, 0);
    var html = '<section class="fade-in"><div class="rounded-3xl bg-gradient-to-br from-indigo-600 via-blue-600 to-sky-500 text-white p-6 sm:p-10 mb-6">' +
      '<h1 class="text-2xl sm:text-4xl font-extrabold leading-tight">भारत की प्रमुख परीक्षाओं की तैयारी – एक ही जगह</h1>' +
      '<p class="mt-2 text-white/90 max-w-2xl">PYQ पैटर्न सेट, चैप्टर-वाइज व सेक्शनल टेस्ट और 100 प्रश्न के फुल मॉक – रियल एग्जाम इंटरफेस के साथ।</p>' +
      '<div class="mt-5 flex flex-wrap gap-3 text-sm"><span class="bg-white/20 rounded-full px-4 py-1.5">' + fmt(totalQ) + '+ प्रश्न (कैटलॉग लक्ष्य)</span>' +
      '<span class="bg-white/20 rounded-full px-4 py-1.5">' + fmt(totalS) + '+ टेस्ट/सेट (कैटलॉग लक्ष्य)</span>' +
      '<span class="bg-white/20 rounded-full px-4 py-1.5">हर टेस्ट: ' + QCOUNT + ' प्रश्न</span></div></div>' +
      '<div class="mb-6 rounded-xl border border-amber-300 bg-amber-50 dark:bg-amber-950/40 dark:border-amber-700 text-amber-900 dark:text-amber-200 text-sm p-3"><b>डेमो नोट:</b> हर टेस्ट में ' + QCOUNT + ' प्रश्न हैं। GK/विषय के नमूना प्रश्न सीमित हैं; बाकी प्रश्न गणित/रीज़निंग के स्वतः बनते हैं। असली प्रश्न <code>ExamMock.loadBank()</code> से जोड़ें।</div>' +
      '<h2 class="text-xl font-bold mb-4">परीक्षा चुनें</h2>';
    if (!list.length) html += '<p class="text-slate-500">कोई परीक्षा नहीं मिली।</p>';
    html += '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">';
    list.forEach(function (e) {
      html += '<button onclick="openExam(\'' + e.id + '\')" class="text-left rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition overflow-hidden">' +
        '<div class="bg-gradient-to-r ' + e.color + ' text-white p-4 flex items-center gap-3"><span class="text-3xl">' + e.icon + '</span><div><div class="font-bold text-lg">' + esc(e.name) + '</div><div class="text-xs text-white/85">' + esc(e.sub) + '</div></div></div>' +
        '<div class="p-4 grid grid-cols-2 gap-3 text-center"><div><div class="text-xl font-extrabold text-indigo-600 dark:text-indigo-300">' + fmt(e.qs) + '+</div><div class="text-xs text-slate-500">प्रश्न</div></div>' +
        '<div><div class="text-xl font-extrabold text-indigo-600 dark:text-indigo-300">' + fmt(e.sets) + '+</div><div class="text-xs text-slate-500">प्रैक्टिस सेट / टेस्ट</div></div></div></button>';
    });
    $app.innerHTML = html + '</div></section>';
  }

  function renderExam() {
    var e = getExam(S.examId); if (!e) { S.view = 'home'; return render(); }
    var tab = TABS.filter(function (t) { return t.id === S.tab; })[0];
    var total = tabTotal(e, tab), shown = Math.min(S.shown[e.id + tab.id] || 12, total);
    var html = '<section class="fade-in"><button onclick="goHome()" class="text-sm text-indigo-600 dark:text-indigo-300 mb-3">← सभी परीक्षाएँ</button>' +
      '<div class="rounded-2xl bg-gradient-to-r ' + e.color + ' text-white p-5 mb-5 flex items-center gap-4"><span class="text-4xl">' + e.icon + '</span><div><h1 class="text-2xl font-extrabold">' + esc(e.name) + '</h1><p class="text-sm text-white/90">' + esc(e.sub) + ' • ' + fmt(e.qs) + '+ प्रश्न • ' + fmt(e.sets) + '+ सेट</p></div></div><div class="flex gap-2 overflow-x-auto pb-2 mb-4">';
    TABS.forEach(function (t) {
      html += '<button onclick="setTab(\'' + t.id + '\')" class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-semibold border ' + (t.id === S.tab ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600') + '">' + tabLabel(e, t) + ' <span class="opacity-75">(' + fmt(tabTotal(e, t)) + ')</span></button>';
    });
    html += '</div>';
    var items = [], q = S.search;
    if (q) {
      for (var i = 0; i < total && items.length < 50; i++) { var t0 = makeTest(e, tab.id, i); if (t0.name.toLowerCase().indexOf(q) !== -1) items.push(t0); }
      html += '<p class="text-sm text-slate-500 mb-3">"' + esc(q) + '" के लिए ' + items.length + (items.length === 50 ? '+' : '') + ' परिणाम</p>';
    } else for (var j = 0; j < shown; j++) items.push(makeTest(e, tab.id, j));
    var hist = store('em_history') || [];
    html += '<div class="grid md:grid-cols-2 gap-3">';
    items.forEach(function (t) {
      var done = hist.filter(function (h) { return h.id === t.id; });
      html += '<div class="' + CARD + 'p-4 flex flex-col sm:flex-row sm:items-center gap-3 justify-between"><div><div class="font-semibold">' + esc(t.name) + '</div>' +
        '<div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500 dark:text-slate-400"><span>📋 ' + t.n + ' प्रश्न</span><span>⏱ ' + t.minutes + ' मिनट</span><span>🎯 ' + t.marks + ' अंक</span>' + (e.neg ? '<span>➖ ' + e.neg + ' नेगेटिव</span>' : '<span>कोई नेगेटिव नहीं</span>') + '</div>' +
        (done.length ? '<div class="text-xs mt-1 text-emerald-600">✔ पिछला स्कोर: ' + done[done.length - 1].score + '</div>' : '') + '</div>' +
        '<button onclick="startTest(\'' + t.id + '\')" class="shrink-0 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2">Start Test</button></div>';
    });
    html += '</div>';
    if (!q && shown < total) html += '<div class="text-center mt-5"><button onclick="loadMore()" class="rounded-lg border border-indigo-500 text-indigo-600 dark:text-indigo-300 px-5 py-2 text-sm font-semibold">और टेस्ट दिखाएँ (' + fmt(total - shown) + ' शेष)</button></div>';
    $app.innerHTML = html + '<p class="text-xs text-slate-500 mt-6">ध्यान दें: डेमो में PYQ सेट असली पुराने पेपर नहीं, पैटर्न-आधारित सेट हैं। असली PYQ <code>ExamMock.loadBank()</code> से जोड़ें।</p></section>';
  }

  function findTest(id) { var p = id.split('-'), ex = getExam(p[0]); return ex ? makeTest(ex, p[p.length - 2], parseInt(p[p.length - 1], 10)) : null; }
  window.startTest = function (id) {
    var meta = findTest(id); if (!meta) return;
    var qs = buildQuestions(meta);
    S.test = { meta: meta, qs: qs, ans: qs.map(function () { return -1; }), marked: qs.map(function () { return false; }), visited: qs.map(function () { return false; }), cur: 0, left: meta.minutes * 60, done: false, sel: -1 };
    S.test.visited[0] = true; S.view = 'test'; startTimer(); render(); window.scrollTo(0, 0);
  };
  function startTimer() {
    stopTimer();
    S.timer = setInterval(function () {
      if (!S.test || S.test.done) return stopTimer();
      S.test.left--; var el = $('timerBox'); if (el) el.textContent = timeStr(S.test.left);
      if (S.test.left <= 0) { stopTimer(); finishTest(true); }
    }, 1000);
  }
  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  function timeStr(s) { s = Math.max(0, s); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); }

  function paletteClass(T, i) {
    var a = T.ans[i] !== -1, m = T.marked[i], base;
    if (m && a) base = 'bg-purple-600 text-white ring-2 ring-emerald-400';
    else if (m) base = 'bg-purple-600 text-white';
    else if (a) base = 'bg-emerald-500 text-white';
    else if (T.visited[i]) base = 'bg-rose-500 text-white';
    else base = 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200';
    return base + (i === T.cur ? ' outline outline-2 outline-offset-2 outline-indigo-500' : '');
  }

  function renderTest() {
    var T = S.test; if (!T) { S.view = 'home'; return render(); }
    var q = T.qs[T.cur], sel = T.sel, ex = getExam(T.meta.exam);
    var html = '<section class="fade-in"><div class="' + CARD + 'flex items-center justify-between gap-3 mb-4 p-3"><div class="min-w-0"><div class="font-bold truncate">' + esc(T.meta.name) + '</div><div class="text-xs text-slate-500">प्रश्न ' + (T.cur + 1) + ' / ' + T.qs.length + ' • ' + esc(q.s) + '</div></div>' +
      '<div class="text-center"><div class="text-[10px] uppercase text-slate-500">शेष समय</div><div id="timerBox" class="font-mono text-xl font-extrabold text-rose-600">' + timeStr(T.left) + '</div></div></div>' +
      '<div class="grid lg:grid-cols-[1fr_300px] gap-4"><div class="' + CARD + 'p-5"><p class="text-xs text-slate-500 mb-1">+' + ex.marks + ' अंक' + (ex.neg ? ' / −' + ex.neg : '') + '</p><h2 class="text-lg font-semibold mb-4">Q' + (T.cur + 1) + '. ' + esc(q.q) + '</h2><div class="space-y-2">';
    q.o.forEach(function (o, k) {
      var ch = sel === k;
      html += '<label class="flex items-center gap-3 rounded-lg border p-3 cursor-pointer ' + (ch ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-950/50' : 'border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700/50') + '"><input type="radio" name="opt" class="accent-indigo-600" ' + (ch ? 'checked' : '') + ' onchange="pick(' + k + ')"><span class="font-semibold w-5">' + 'ABCD'.charAt(k) + '.</span><span>' + esc(o) + '</span></label>';
    });
    html += '</div><div class="mt-6 flex flex-wrap gap-2">' +
      '<button onclick="saveNext()" class="rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 text-sm font-semibold">Save &amp; Next</button>' +
      '<button onclick="markNext()" class="rounded-lg bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 text-sm font-semibold">Mark for Review &amp; Next</button>' +
      '<button onclick="clearResp()" class="rounded-lg border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm">Clear Response</button>' +
      '<button onclick="goTo(' + Math.max(0, T.cur - 1) + ')" class="rounded-lg border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm">← Previous</button></div></div>' +
      '<aside class="' + CARD + 'p-4 h-fit lg:sticky lg:top-20"><h3 class="font-bold mb-3">प्रश्न पैलेट</h3><div class="grid grid-cols-5 gap-2 mb-4 max-h-72 overflow-y-auto p-1">';
    T.qs.forEach(function (_, i) { html += '<button onclick="goTo(' + i + ')" class="h-9 rounded-md text-sm font-semibold ' + paletteClass(T, i) + '">' + (i + 1) + '</button>'; });
    var att = T.ans.filter(function (a) { return a !== -1; }).length;
    html += '</div><div class="text-xs space-y-1 text-slate-600 dark:text-slate-300 mb-4">' +
      '<div><span class="inline-block w-3 h-3 rounded bg-emerald-500 mr-2"></span>Attempted: ' + att + '</div>' +
      '<div><span class="inline-block w-3 h-3 rounded bg-rose-500 mr-2"></span>Unattempted (देखे गए): ' + T.qs.filter(function (_, i) { return T.visited[i] && T.ans[i] === -1 && !T.marked[i]; }).length + '</div>' +
      '<div><span class="inline-block w-3 h-3 rounded bg-purple-600 mr-2"></span>Marked for Review: ' + T.marked.filter(Boolean).length + '</div>' +
      '<div><span class="inline-block w-3 h-3 rounded bg-slate-300 dark:bg-slate-600 mr-2"></span>Not Visited: ' + T.visited.filter(function (v) { return !v; }).length + '</div></div>' +
      '<button onclick="confirmSubmit()" class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 font-semibold">Submit Test</button></aside></div></section>';
    $app.innerHTML = html;
  }

  window.pick = function (k) { S.test.sel = k; renderTest(); };
  function go(i) { var T = S.test; i = Math.max(0, Math.min(i, T.qs.length - 1)); T.cur = i; T.visited[i] = true; T.sel = T.ans[i]; renderTest(); }
  window.goTo = function (i) { var T = S.test; T.ans[T.cur] = T.sel; go(i); };
  window.saveNext = function () { var T = S.test; T.ans[T.cur] = T.sel; T.marked[T.cur] = false; go(T.cur + 1); };
  window.markNext = function () { var T = S.test; T.ans[T.cur] = T.sel; T.marked[T.cur] = true; go(T.cur + 1); };
  window.clearResp = function () { var T = S.test; T.sel = -1; T.ans[T.cur] = -1; renderTest(); };
  window.confirmSubmit = function () {
    var T = S.test; T.ans[T.cur] = T.sel;
    var att = T.ans.filter(function (a) { return a !== -1; }).length;
    showModal('टेस्ट सबमिट करें?', 'कुल प्रश्न: <b>' + T.qs.length + '</b><br>Attempted: <b>' + att + '</b><br>Unattempted: <b>' + (T.qs.length - att) + '</b><br>Marked for Review: <b>' + T.marked.filter(Boolean).length + '</b>',
      [{ label:'वापस जाएँ' }, { label:'Submit', primary:true, fn:function () { finishTest(false); } }]);
  };

  function finishTest(auto) {
    var T = S.test; if (!T || T.done) return;
    T.ans[T.cur] = T.sel; T.done = true; stopTimer();
    var ex = getExam(T.meta.exam), c = 0, w = 0, u = 0;
    T.qs.forEach(function (q, i) { if (T.ans[i] === -1) u++; else if (T.ans[i] === q.a) c++; else w++; });
    var score = Math.round((c * ex.marks - w * ex.neg) * 100) / 100, acc = (c + w) ? Math.round(c / (c + w) * 100) : 0;
    S.result = { meta: T.meta, qs: T.qs, ans: T.ans, c: c, w: w, u: u, score: score, max: T.qs.length * ex.marks, acc: acc, used: T.meta.minutes * 60 - Math.max(0, T.left), auto: auto };
    var h = store('em_history') || []; h.push({ id: T.meta.id, name: T.meta.name, score: score, acc: acc }); store('em_history', h.slice(-100));
    S.view = 'result'; render(); window.scrollTo(0, 0);
  }

  function renderResult() {
    var R = S.result; if (!R) { S.view = 'home'; return render(); }
    var html = '<section class="fade-in"><div class="rounded-2xl bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-6 mb-5"><p class="text-sm text-white/80">' + esc(R.meta.name) + (R.auto ? ' • समय समाप्त, ऑटो-सबमिट' : '') + '</p>' +
      '<div class="mt-1 text-4xl font-extrabold">' + R.score + ' <span class="text-xl font-semibold text-white/80">/ ' + R.max + '</span></div></div><div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">';
    [['सही',R.c,'text-emerald-600'],['गलत',R.w,'text-rose-600'],['अनुत्तरित',R.u,'text-slate-500'],['सटीकता',R.acc + '%','text-indigo-600'],['लिया गया समय',pad(Math.floor(R.used / 60)) + ':' + pad(R.used % 60),'text-blue-600']].forEach(function (x) {
      html += '<div class="' + CARD + 'p-4 text-center"><div class="text-2xl font-extrabold ' + x[2] + '">' + x[1] + '</div><div class="text-xs text-slate-500">' + x[0] + '</div></div>';
    });
    html += '</div><h2 class="text-lg font-bold mb-3">उत्तर व स्पष्टीकरण</h2><div class="space-y-4">';
    R.qs.forEach(function (q, i) {
      var ua = R.ans[i], ok = ua === q.a, skip = ua === -1;
      html += '<div class="rounded-xl bg-white dark:bg-slate-800 border ' + (skip ? 'border-slate-200 dark:border-slate-700' : ok ? 'border-emerald-400' : 'border-rose-400') + ' p-4"><div class="flex justify-between gap-2 mb-2"><p class="font-semibold">Q' + (i + 1) + '. ' + esc(q.q) + '</p><span class="text-xs font-bold shrink-0 ' + (skip ? 'text-slate-500' : ok ? 'text-emerald-600' : 'text-rose-600') + '">' + (skip ? 'Unattempted' : ok ? 'सही ✔' : 'गलत ✘') + '</span></div><ul class="space-y-1 text-sm">';
      q.o.forEach(function (o, k) {
        var cls = k === q.a ? 'bg-emerald-100 dark:bg-emerald-900/50' : (k === ua ? 'bg-rose-100 dark:bg-rose-900/50' : '');
        html += '<li class="rounded px-2 py-1 ' + cls + '">' + 'ABCD'.charAt(k) + '. ' + esc(o) + (k === q.a ? ' ✔' : '') + (k === ua && k !== q.a ? ' (आपका उत्तर)' : '') + '</li>';
      });
      html += '</ul><p class="mt-2 text-sm text-slate-600 dark:text-slate-300"><b>स्पष्टीकरण:</b> ' + esc(q.e) + '</p></div>';
    });
    $app.innerHTML = html + '</div><div class="mt-6 flex gap-3"><button onclick="retry()" class="rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 font-semibold">दोबारा दें</button><button onclick="backToExam()" class="rounded-lg border border-slate-300 dark:border-slate-600 px-5 py-2">टेस्ट सूची</button></div></section>';
  }
  window.retry = function () { startTest(S.result.meta.id); };
  window.backToExam = function () { S.examId = S.result.meta.exam; S.tab = S.result.meta.tab; S.view = 'exam'; S.test = null; render(); window.scrollTo(0, 0); };

  /* ---------- Public API: असली डेटा / नई परीक्षा जोड़ने के लिए ---------- */
  window.ExamMock = {
    // loadBank('upsssc', [{ s:'विषय', q:'प्रश्न', o:['A','B','C','D'], a:1, e:'व्याख्या' }, ...])
    loadBank: function (examId, arr) {
      if (!BANK[examId] || !Array.isArray(arr)) return false;
      var clean = arr.filter(function (x) { return x && x.q && Array.isArray(x.o) && x.o.length === 4 && x.a >= 0 && x.a < 4; })
        .map(function (x) { return { s: x.s || 'सामान्य', q: x.q, o: x.o, a: x.a, e: x.e || '' }; });
      if (!clean.length) return false;
      BANK[examId] = clean; if (S.view === 'exam' || S.view === 'home') render(); return true;
    },
    // addExam({id,name,sub,icon,color,marks,neg,time,qs,sets,tags}, [प्रश्न...])
    addExam: function (exam, arr) {
      if (getExam(exam.id)) return this.loadBank(exam.id, arr);
      exam.tags = exam.tags || exam.id; exam.qs = exam.qs || 1000; exam.sets = exam.sets || 500;
      EXAMS.push(exam); BANK[exam.id] = [Q('सामान्य', 'placeholder', ['a','b','c','d'], 0, '')];
      return this.loadBank(exam.id, arr);
    }
  };

  if (store('em_dark')) { document.documentElement.classList.add('dark'); $('darkBtn').textContent = '☀️'; }
  window.addEventListener('beforeunload', function (e) { if (S.view === 'test' && S.test && !S.test.done) { e.preventDefault(); e.returnValue = ''; } });
  render();
})();
</script>
</body>
</html>
